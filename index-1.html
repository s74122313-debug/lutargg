<!DOCTYPE html>
<html lang="ru">

<title>LUTARGG</title>

<style>
:root{--bg:#090a18;--p:#12132b;--p2:#1b1c3d;--cy:#00f0ff;--mg:#ff2bd6;--tx:#e8e8ff;--mu:#8a8ab0;--gr:#7dffb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:relative;display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:radial-gradient(circle at 50% -10%,#2a0f4a 0,#090a18 55%)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid #26265a;background:#0b0b20cc}
.logo{font-weight:900;letter-spacing:2px;font-size:18px;background:linear-gradient(90deg,var(--cy),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
#money{margin-left:auto;font-weight:800;color:var(--gr);font-size:16px;background:#0d2a1c;border:1px solid #1f6a45;border-radius:20px;padding:4px 12px;cursor:pointer;text-shadow:0 0 10px #2bff8855}
#lvl{background:var(--p2);border:2px solid var(--cy);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
main{flex:1;overflow-y:auto;padding:10px 12px 18px;-webkit-overflow-scrolling:touch}
nav{display:flex;overflow-x:auto;background:#0b0b20;border-top:1px solid #2a2a55;padding-bottom:env(safe-area-inset-bottom);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-width:66px;background:none;border:0;color:var(--mu);padding:8px 4px 7px;font-size:10px;font-weight:600;cursor:pointer;position:relative}
nav button svg{display:block;width:22px;height:22px;margin:0 auto 2px}
nav button.on{color:var(--cy)}
nav button.on svg{filter:drop-shadow(0 0 5px var(--cy))}
nav button.dot::after{content:"";position:absolute;top:6px;right:18px;width:8px;height:8px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 6px #ff3b5c}
h2{margin:6px 0 10px;font-size:20px}h2 small{color:var(--mu);font-size:13px}h3{margin:4px 0 8px}
.mu{color:var(--mu)}
.card{background:var(--p);border:1px solid #2a2a5a;border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
@media(min-width:420px){.grid3{grid-template-columns:repeat(3,1fr)}}
.case{position:relative;text-align:center;cursor:pointer;margin:0;padding:10px 8px 10px;background:linear-gradient(165deg,hsl(var(--h),55%,19%),#0f1028 70%);border-color:hsl(var(--h),60%,36%);overflow:hidden}
.case::before{content:"";position:absolute;left:-20%;right:-20%;top:-10%;height:70%;background:radial-gradient(circle,hsl(var(--h),90%,55%,.35),transparent 65%)}
.case:active{transform:scale(.97)}
.case .fi{position:relative;margin:14px 0 4px}
.case .fi svg{width:100%;height:auto;filter:drop-shadow(0 0 9px var(--c)) drop-shadow(0 4px 4px #000a)}
.case b{position:relative;display:block;margin-top:2px;font-size:14px}
.case .price{position:relative}
.tag{position:absolute;z-index:2;top:6px;left:6px;font-size:9px;font-weight:900;letter-spacing:.5px;background:#000b;border:1px solid hsl(var(--h),80%,55%);color:#fff;border-radius:8px;padding:2px 6px}
.price{color:var(--gr);font-weight:800}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800;color:#001;background:linear-gradient(90deg,var(--cy),#7dffb0);cursor:pointer;margin-top:8px}
.btn.alt{background:linear-gradient(90deg,var(--mg),#ff8a2b);color:#fff}
.btn.dark{background:#22224a;color:#cfd0ff}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--p2);border:1px solid #33336a;color:var(--tx);border-radius:18px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.chip.on{border-color:var(--c,var(--cy));color:var(--c,var(--cy));box-shadow:0 0 8px var(--c,var(--cy))}
.sk{position:relative;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 30%,transparent),transparent 72%),linear-gradient(180deg,#191937,#0e0e22);border:1px solid var(--c);border-radius:10px;padding:6px 4px 6px;text-align:center;box-shadow:inset 0 -22px 28px -22px var(--c)}
.sk.sel{outline:3px solid var(--cy)}
.sk svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 3px #000b)}
.sk small{display:block;font-size:10px;line-height:1.15;min-height:24px;color:var(--c)}
.sk b{font-size:12px;color:var(--gr)}
.mini-btn{display:block;width:100%;margin-top:4px;background:#2b1a3a;color:#ff9ad9;border:1px solid #6a2a6a;border-radius:8px;padding:5px;font-size:11px;font-weight:700}
.modal{position:absolute;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.box{position:relative;width:100%;max-height:92%;overflow-y:auto;background:#0e0f26;border:1px solid var(--cy);border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 0 30px #00f0ff44}
.x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--mu);font-size:20px}
.reel{position:relative;height:132px;overflow:hidden;background:#080816;border:1px solid #2c2c60;border-radius:12px;margin:8px 0}
.reel .idle{display:flex;align-items:center;justify-content:center;height:100%;padding:0 20%}
.reel .idle svg{width:100%;height:auto;filter:drop-shadow(0 0 12px var(--c))}
.strip{display:flex;height:100%;will-change:transform}
.ri{flex:0 0 120px;height:100%;padding:10px 4px 6px;text-align:center;border-right:1px solid #1c1c40;background:linear-gradient(180deg,transparent 55%,color-mix(in srgb,var(--c) 34%,transparent))}
.ri svg{width:108px;height:auto;filter:drop-shadow(0 2px 3px #000a)}.ri small{display:block;font-size:9px;color:var(--c);line-height:1.1;margin-top:2px}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--cy);box-shadow:0 0 10px var(--cy);z-index:2}
.odds{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;font-weight:700;margin:8px 0}
.drops{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,150px));justify-content:center;gap:8px;margin:8px 0;animation:pop .4s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
details summary{cursor:pointer;color:var(--mu);margin:6px 0}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prow .ph{display:flex;gap:8px;align-items:center}.prow .ph span{margin-left:auto;color:var(--gr);font-weight:800}
.prow em{font-size:11px;color:var(--mu)}
.got{display:flex;flex-wrap:wrap;gap:4px;min-height:14px}
.got i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.tapwrap{text-align:center}
#tapbtn{width:210px;height:210px;border-radius:50%;border:6px solid var(--cy);background:radial-gradient(circle at 35% 30%,#4ff,#07a 55%,#024);box-shadow:0 0 40px #00f0ff88,inset 0 0 30px #0008;margin:10px auto;display:block;touch-action:manipulation;transition:transform .05s}
#tapbtn:active{transform:scale(.94)}
#combo{height:10px;background:#1a1a38;border-radius:6px;overflow:hidden;margin:4px 0}
#combo i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--mg),#ff8a2b)}
.fl{position:fixed;pointer-events:none;font-weight:900;color:var(--gr);text-shadow:0 0 8px #000;animation:fl .9s forwards;z-index:60;font-size:20px}
@keyframes fl{to{transform:translateY(-80px);opacity:0}}
.up{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #26265a}
.up:last-child{border:0}.up div{flex:1;font-size:13px}.up small{color:var(--mu);display:block}
.up button{background:var(--p2);border:1px solid var(--gr);color:var(--gr);border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px}
.up button:disabled{opacity:.35}
.wheel{width:230px;height:230px;display:block;margin:6px auto}
.slot{flex:1;min-height:110px;background:var(--p);border:1px dashed #44448a;border-radius:12px;padding:6px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:12px;color:var(--mu);cursor:pointer}
.win{color:#2bff88;text-shadow:0 0 12px #2bff88}.lose{color:#ff3b5c;text-shadow:0 0 12px #ff3b5c}
.shake{animation:sh .5s}@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.merge{width:90px;height:90px;border-radius:50%;margin:16px auto;border:5px solid var(--mg);border-top-color:var(--cy);animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:12px;background:#1a1a38;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg))}
.pass{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;align-items:stretch;margin-bottom:6px}
.pass .lv{display:flex;align-items:center;justify-content:center;background:var(--p2);border-radius:8px;font-weight:800;font-size:13px}
.rw{background:var(--p);border:1px solid #2c2c60;border-radius:8px;padding:6px;font-size:11px;text-align:center;min-height:54px}
.rw.ok{border-color:var(--gr);cursor:pointer}.rw.done{opacity:.4}.rw.lock{opacity:.55}
.shop{display:flex;align-items:center;gap:10px}.shop div{flex:1}.shop small{color:var(--mu);display:block}.shop button{background:linear-gradient(90deg,#ffd54a,#ff8a2b);border:0;border-radius:10px;padding:10px 14px;font-weight:900;color:#1a0f00;white-space:nowrap}
.shop .ic{flex:0 0 38px;font-size:26px;text-align:center}
.lb{display:flex;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px solid #26265a}.lb b{width:26px;color:var(--mu)}.lb span{margin-left:auto;color:var(--gr)}.lb.me{color:var(--cy);font-weight:800}
.ava{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--mg));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#001}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;border:1px solid var(--cy);padding:9px 16px;border-radius:20px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.live{display:flex;gap:6px;overflow:hidden;margin:0 0 10px;padding-bottom:2px;mask-image:linear-gradient(90deg,#000 80%,transparent)}
.lv{flex:0 0 74px;background:linear-gradient(180deg,#191937,#0e0e22);border:1px solid var(--c);border-radius:8px;padding:3px;text-align:center;box-shadow:inset 0 -14px 16px -14px var(--c);animation:pop .35s}
.lv svg{display:block;width:100%;height:auto}.lv small{display:block;font-size:8px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv.me small{color:var(--cy);font-weight:800}
.dr{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0}
.dr div{background:var(--p2);border:1px solid #33336a;border-radius:8px;padding:6px 2px;text-align:center;font-size:10px;line-height:1.25}
.dr div b{display:block;font-size:11px;color:var(--mu)}
.dr .done{opacity:.45;border-color:var(--gr)}.dr .now{border-color:var(--cy);box-shadow:0 0 10px var(--cy)}
.q{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #26265a;font-size:13px}.q:last-child{border:0}
.q .t{flex:1}.q small{display:block;color:var(--mu)}
.q .bar{margin-top:4px;height:7px}
.q button{background:var(--p2);border:1px solid var(--gr);color:var(--gr);border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px}
.q button:disabled{opacity:.35}
input[type=text],input[type=number],select,textarea{width:100%;background:#0b0b22;color:var(--tx);border:1px solid #33336a;border-radius:10px;padding:10px;font-size:14px;margin:4px 0}
textarea{height:90px;font-size:11px;font-family:monospace}
.adm{border-color:#ff8a2b}.adm h3{color:#ffb347}

</style>

async function doUpgrade(){

  busy=true;
  try{

    const deg=360*5+(win?(a>4?2+Math.random()*(a-4):a/2):a+2+Math.random()*(356-a));
    U.sel.forEach(u=>{const k=S.inv.findIndex(x=>x.u===u);if(k>=0)S.inv.splice(k,1)});
    const p=$('#ptr');p.style.transition='transform 4s cubic-bezier(.1,.7,.1,1)';p.style.transform=`rotate(${deg}deg)`;sfx('tick');

async function doContract(){
  if(busy)return;const n=C.sel.length;if(n<5||n>10)return;busy=true;
  try{
    const r=SK[invOf(C.sel[0]).s].r;
    C.sel.forEach(u=>{const k=S.inv.findIndex(x=>x.u===u);if(k>=0)S.inv.splice(k,1)});
    $('#cres').innerHTML='<div class="merge"></div>';sfx('tick');await sleep(1800);
    const pool=SK.filter(s=>s.r===r+1&&!s.ev).sort((a,b)=>a.price-b.price);
    const res=pool[Math.min(pool.length-1,Math.floor(Math.pow(Math.random(),5/n)*pool.length))];
    giveSkin(res.id);liveAdd(res.id,true);addXp(30);qAdd('contract');sfx('win');haptic('success');
    if(res.price>S.st.best){S.st.best=res.price;S.st.bestN=res.name}
    C.sel=[];$('#cres').innerHTML=`<div class="drops">${skinCard(res)}</div><button class="btn alt" onclick="go()">Ещё контракт</button>`;
  }finally{busy=false;save();updateTop()}
}

function hqSvg(l){
  const floors=Math.min(12,2+Math.ceil(l/2)),fh=22,h=floors*fh,col=`hsl(${(l*15+180)%360},100%,60%)`;
  let w='';for(let f=0;f<floors;f++)for(let i=0;i<5;i++){const lit=(f*7+i*3+l)%4!==0;w+=`<rect x="${62+i*24}" y="${270-h+f*fh+5}" width="14" height="12" rx="2" fill="${lit?col:'#1c1c3c'}" opacity="${lit?.9:1}"/>`}
  return `<svg viewBox="0 0 240 300" style="width:100%;max-height:300px"><rect x="0" y="270" width="240" height="30" fill="#0c0c20"/><rect x="48" y="${270-h}" width="144" height="${h}" rx="4" fill="#14142e" stroke="${col}" stroke-width="2" style="filter:drop-shadow(0 0 8px ${col})"/>${w}
  ${l>=10?`<line x1="120" y1="${270-h}" x2="120" y2="${270-h-30}" stroke="${col}" stroke-width="3"/><circle cx="120" cy="${270-h-32}" r="4" fill="${col}"/>`:''}
  ${l>=5?`<rect x="30" y="${270-h*0.5}" width="18" height="${h*0.5}" fill="#101028" stroke="${col}"/>`:''}${l>=15?`<rect x="192" y="${270-h*0.6}" width="20" height="${h*0.6}" fill="#101028" stroke="${col}"/>`:''}
  <text x="120" y="${270-h-(l>=10?40:8)}" text-anchor="middle" font-size="16" font-weight="900" fill="${col}" letter-spacing="2">LUTARGG HQ</text></svg>`;
}

const GS=r=>SK.filter(s=>s.r===r&&GUN(s));
function reward(L,prem){
  if(!prem){if(L%5===0){const r=L<=10?1:L<=25?2:L<=40?3:4;return{s:GS(r)[L%GS(r).length]}}return{m:L*20}}
  if(L%10===0){const r=Math.min(5,L/10+1);return{f:Math.min(5,L/10),s:GS(r)[L%GS(r).length]}}
  if(L%3===0){const r=Math.min(5,1+Math.floor(L/12));return{s:GS(r)[L%GS(r).length]}}
  return{m:L*60};
}
function rwText(r){return [r.m?`💵 $${fmt(r.m)}`:'',r.s?`<span style="color:${RAR[r.s.r].c}">${r.s.name}</span>`:'',r.f?`🖼 Рамка ${r.f}`:''].filter(Boolean).join('<br>')}
function seasonLeft(){const d=new Date(),end=new Date(d.getFullYear(),d.getMonth()+1,1)-1000,ms=Math.max(0,end-d);return Math.floor(ms/864e5)+' д '+Math.floor(ms%864e5/36e5)+' ч'}
function pgPass(){
  const L=plvl(),prog=L>=50?100:S.xp%100;

    const f=reward(i,false),p=reward(i,true),open=i<=L;
    rows+=`<div class="pass"><div class="lv">${i}</div>
    <div class="rw ${S.fc.includes(i)?'done':open?'ok':'lock'}" ${open&&!S.fc.includes(i)?`onclick="claimPass(${i},0)"`:''}>${rwText(f)}</div>
    <div class="rw ${S.pc.includes(i)?'done':open&&S.premium?'ok':'lock'}" ${open&&S.premium&&!S.pc.includes(i)?`onclick="claimPass(${i},1)"`:''}>${S.premium?'':'🔒 '}${rwText(p)}</div></div>`;
  }
  return `<h2>Батл Пасс <small>сезон ${(new Date().getFullYear()-2026)*12+new Date().getMonth()-9}</small></h2><div class="card"><b>Уровень ${L}/50</b> <span class="mu">· до конца сезона ${seasonLeft()}</span><div class="bar" style="margin:8px 0"><i style="width:${prog}%"></i></div><p class="mu" style="margin:0">XP: кейсы +20, баттлы +40, контракты +30, апгрейды +15, тапы +5 за 50</p>

}
function applyReward(r){if(r.m)S.money+=r.m;if(r.s)giveSkin(r.s.id);if(r.f)S.frame=Math.max(S.frame,r.f)}
function claimPass(i,prem,quiet){
  const list=prem?S.pc:S.fc;if(list.includes(i)||i>plvl()||(prem&&!S.premium))return;

function avaTap(){avaTaps++;clearTimeout(avaT);avaT=setTimeout(()=>avaTaps=0,2500);if(avaTaps>=7){avaTaps=0;if(isAdmin())return toast('Админка уже включена');adminLogin()}}
function adminLogin(){modal(`<h3>Вход в админку</h3><input type="text" id="acode" placeholder="Код доступа" autocomplete="off"><button class="btn" onclick="adminEnter()">Войти</button><p class="mu" style="font-size:11px">Это локальная админка: она меняет только сохранение на этом устройстве.</p>`)}
function adminEnter(){const v=$('#acode').value.trim();if(v!==ADMIN_CODE)return toast('Неверный код');S.adm.on=true;save();closeModal();navBuild();toast('Админка включена');go('admin')}
function pgMe(){
  const st=S.st,my=score(),bots=BOTS.map((n,i)=>({n,v:Math.round(300*Math.pow(1.75,BOTS.length-i)*(1+(i%3)*0.1))}));
  const all=[...bots,{n:uname+' (ты)',v:my,me:1}].sort((a,b)=>b.v-a.v);
  return `<h2>Профиль</h2><div class="card"><div class="row" style="align-items:center"><div class="ava" onclick="avaTap()" style="border:4px solid ${FRAMES[S.frame]}">${uname[0].toUpperCase()}</div><div><b style="font-size:18px;color:${NAMEC[S.nameColor]}">${uname}</b><br><span class="mu">Уровень пасса ${plvl()} · Здание ${S.hq}</span>${vip()?'<br><span class="win">⭐ VIP</span>':''}</div></div>
  <p>Открыто кейсов: <b>${st.opened}</b><br>Тапов: <b>${st.taps}</b><br>Баттлы: <b class="win">${st.bw}</b> / <b class="lose">${st.bl}</b><br>Апгрейды: <b class="win">${st.uw}</b> / <b class="lose">${st.ul}</b><br>Лучший дроп: <b>${st.bestN}</b> ($${fmt(st.best)})<br>Потрачено на кейсы: $${fmt(st.spent)}</p>
  <div class="row"><button class="btn" onclick="S.sound=!S.sound;save();toast(S.sound?'Звук вкл':'Звук выкл')">🔊 Звук</button><button class="btn alt" onclick="share()">Позвать друга</button></div>
  <button class="btn dark" onclick="resetAll()">Сбросить прогресс</button><p class="mu" style="text-align:center;font-size:11px">LUTARGG v${VERSION}</p></div>
  <div class="card"><h3>Таблица лидеров</h3>${all.map((p,i)=>`<div class="lb ${p.me?'me':''}"><b>${i+1}</b><span style="margin:0;color:${p.me?NAMEC[S.nameColor]:'inherit'}">${p.n}</span><span>$${fmt(p.v)}</span></div>`).join('')}</div>`;
}
function share(){const text='Заходи в LUTARGG — кейсы, баттлы и тапалка!',url=location.href;
  if(inTg&&tg.openTelegramLink)tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text));
  else if(navigator.share)navigator.share({title:'LUTARGG',text,url}).catch(()=>{});else toast('Ссылка: '+url)}
function resetAll(){ask('Удалить весь прогресс?',ok=>{if(!ok)return;const a=S.adm;S=merge(null);S.adm=a;save();go('cases')})}

/* ======================= АДМИНКА (локальная) ======================= */
let admQ='',admR=-1;
function admList(){
  const q=admQ.trim().toLowerCase();
  const a=SK.filter(s=>(admR<0||s.r===admR)&&(!q||s.name.toLowerCase().includes(q))).sort((x,y)=>y.price-x.price).slice(0,30);
  return a.map(s=>skinCard(s,`<button class="mini-btn" style="color:#7dffb0;border-color:#1f6a45;background:#0d2a1c" onclick="admGive(${s.id})">Выдать</button>`)).join('')||'<p class="mu">Ничего не найдено</p>';
}
function admGive(id){S.inv.push({u:S.uid++,s:id});save();toast('Выдано: '+SK[id].name)}
function admMoney(n){S.money+=n;save();updateTop();toast('+$'+fmt(n))}
function admSet(k,v){S.adm[k]=v;save();toast('Сохранено');go()}
function pgAdmin(){
  if(!isAdmin())return '<h2>Нет доступа</h2>';
  const a=S.adm;
  return `<h2>Админка <small>v${VERSION}</small></h2>
  <div class="card adm"><h3>💵 Деньги</h3><div class="chips">${[1e3,1e4,1e5,1e6,1e7].map(n=>`<button class="chip" onclick="admMoney(${n})">+$${fmt(n)}</button>`).join('')}<button class="chip" onclick="S.money=0;save();updateTop()">Обнулить</button></div></div>
  <div class="card adm"><h3>🔫 Выдать скин</h3><input type="text" placeholder="Поиск по названию…" value="${admQ.replace(/"/g,'')}" oninput="admQ=this.value;$('#admsk').innerHTML=admList()">
  <div class="chips"><button class="chip ${admR<0?'on':''}" onclick="admR=-1;go()">Все</button>${RAR.map((r,k)=>`<button class="chip ${admR===k?'on':''}" style="--c:${r.c}" onclick="admR=${k};go()">${r.n}</button>`).join('')}</div>
  <div class="grid3" id="admsk">${admList()}</div></div>
  <div class="card adm"><h3>⚙️ События и баланс</h3>
  <p class="mu" style="margin:4px 0">Доп. скидка на кейсы: <b>${a.disc}%</b></p><div class="chips">${[0,10,25,50].map(n=>`<button class="chip ${a.disc===n?'on':''}" onclick="admSet('disc',${n})">${n}%</button>`).join('')}</div>
  <p class="mu" style="margin:4px 0">Множитель удачи (редкие дропы): <b>x${a.luck}</b></p><div class="chips">${[1,1.5,2,3].map(n=>`<button class="chip ${a.luck===n?'on':''}" onclick="admSet('luck',${n})">x${n}</button>`).join('')}</div>
  <p class="mu" style="margin:4px 0">Множитель дохода: <b>x${a.inc}</b></p><div class="chips">${[1,2,5,10].map(n=>`<button class="chip ${a.inc===n?'on':''}" onclick="admSet('inc',${n})">x${n}</button>`).join('')}</div></div>
  <div class="card adm"><h3>🧰 Прочее</h3><div class="chips">
  <button class="chip" onclick="S.xp=Math.min(5000,S.xp+500);save();toast('+500 XP пасса');go()">+500 XP</button>
  <button class="chip" onclick="S.premium=!S.premium;save();go()">Premium: ${S.premium?'вкл':'выкл'}</button>
  <button class="chip" onclick="S.vipUntil=Date.now()+30*864e5;save();go()">VIP 30д</button>
  <button class="chip" onclick="S.freeAt=0;S.dr.last='';S.q={d:'',p:{},c:[]};save();toast('Таймеры сброшены');go()">Сбросить таймеры</button>
  <button class="chip" onclick="S.hq=20;save();go()">Здание MAX</button>
  <button class="chip" onclick="ask('Удалить все скины?',ok=>{if(ok){S.inv=[];save();go()}})">Очистить инвентарь</button></div></div>
  <div class="card adm"><h3>💾 Сохранение</h3><textarea id="admsave" readonly>${JSON.stringify(S)}</textarea>
  <div class="row"><button class="btn dark" onclick="admImport()">Импорт из поля</button><button class="btn dark" onclick="$('#admsave').select();document.execCommand('copy');toast('Скопировано')">Копировать</button></div>
  <button class="btn dark" onclick="S.adm.on=false;save();navBuild();go('me')">Выйти из админки</button>
  <p class="mu" style="font-size:11px">Админка работает только на этом устройстве: общий сервер для всех игроков нужно писать отдельно.</p></div>`;
}
function admImport(){const t=$('#admsave');t.removeAttribute('readonly');ask('Вставь JSON сохранения в поле и подтверди импорт',ok=>{if(!ok)return;try{const j=JSON.parse(t.value);S=merge(j);migrate();save();navBuild();go('admin');toast('Импортировано')}catch(e){toast('Неверный JSON')}})}
/* ======================= ЗАПУСК ======================= */
const RENDER={cases:pgCases,battle:pgBattle,bonus:pgBonus,tap:pgTap,upgrade:pgUpgrade,contract:pgContract,hq:pgHQ,pass:pgPass,shop:pgShop,inv:pgInv,me:pgMe,admin:pgAdmin};
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#090a18');tg.setBackgroundColor('#090a18');tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
// оффлайн-доход
(function(){const dt=Math.min((Date.now()-S.last)/1000,(1+S.offLvl)*3600);const g=autoPS()*dt*(S.offLvl>0?0.5:0.1);
  if(g>=1&&dt>30){S.money+=g;setTimeout(()=>toast('Пока тебя не было: +$'+fmt(g)),600)}})();
if(inTg&&tg.CloudStorage){try{tg.CloudStorage.getItem('lutargg',(e,v)=>{try{const c=JSON.parse(v);if(c&&c.last>S.last){S=merge(c);migrate();navBuild();go()}}catch(x){}})}catch(e){}}
setInterval(()=>{S.money+=autoPS()*0.2;combo=Math.max(0,combo-5);
  const cb=$('#combo i');if(cb)cb.style.width=combo+'%';const ts=$('#tstats');if(ts)ts.textContent=tstats();updateTop()},200);
setInterval(()=>{if(busy||document.hidden)return;const c=CASES[1+Math.floor(Math.random()*(CASES.length-1))];liveAdd(rollSkin(c.w0,c.id).id);const l=$('#live');if(l&&!document.querySelector('.modal'))l.innerHTML=liveHtml()},4000);
setInterval(save,3000);
document.addEventListener('visibilitychange',save);
$('#money').addEventListener('click',()=>go('shop'));
navBuild();go('cases');

</script>
</body>
</html>
